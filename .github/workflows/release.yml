name: Release (npm publish with provenance)

# T37 step 8 "provenance" decision (2026-09-04, delegated by the user → option 2 adopted after
# comparison): publish from GitHub Actions with `npm publish --provenance` instead of a local
# `npm publish` (no provenance). Provenance is a signed attestation (Sigstore) that "this tarball was
# built by this workflow from this commit of this repository" and is shown on the npm page — it is the
# last piece of the effort this project put into supply-chain gates (SHA-pinned Actions, ruleset,
# prepublishOnly). A local publish cannot produce that attestation (npm docs: generated only via the
# OIDC of GitHub Actions/GitLab CI).
#
# Trigger: `v*` tag push **only**. Pushing the tag is itself a human's explicit decision to publish
# (the ruleset protects only branches, but only the owner has push access to this repository). The
# tag name must exactly match the version in package.json (verification step below), and before the
# actual publish `prepublishOnly` (npm run check && npm run verify:pack — no flag = tarball audit
# fail-closed) runs automatically. That is, the order is "tag push → full gate → publish".
#
# Authentication (per npm docs) — stage 2 of 2:
#   1) First publish (v0.1.0, 2026-09-04): the package did not exist yet, so a trusted publisher
#      could not be registered; the repo secret `NPM_TOKEN` (npmjs.com granular access token) was
#      used as `NODE_AUTH_TOKEN`.
#   2) Now (after the first publish): npmjs.com package settings → Trusted Publisher has this
#      repository (Trapa-Eureka/retail-mcp), the workflow file name (release.yml) and the environment
#      (npm-publish) registered, and publishing happens via OIDC alone with no long-lived token —
#      `npm publish` exchanges GitHub's OIDC id-token for a short-lived npm registry token (requires
#      npm CLI 11.5.1+ → the "pin npm version" step below). The `NPM_TOKEN` secret and the
#      `NODE_AUTH_TOKEN` line have been removed. This workflow now holds no long-lived credential.
#      If the registration is missing, publish fails with `ENEEDAUTH`/404 (token exchange) and
#      nothing is published — in that case check the trusted publisher registration in the npmjs.com
#      package settings.
#
# Permissions: workflow-wide `contents: read` (SR2-CI-001 principle). `id-token: write` only on the
# publish job — it is the permission to mint the OIDC token needed for provenance signing and the
# trusted-publishing token exchange, and writes nothing to the repository.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# The same tag never runs twice, but even if a tag is accidentally deleted and pushed again, two
# publishes must not overlap.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish --provenance
    runs-on: ubuntu-latest # provenance is generated only on GitHub-hosted runners (no self-hosted).
    # SR2-CI-003 principle — prepublishOnly runs check (≈3 min) + verify:pack (≈10 min), so 2x observed.
    timeout-minutes: 40
    # GitHub environment — turning on "Required reviewers" under repository Settings → Environments →
    # npm-publish adds one more human approval after the tag push (self-approval is possible even in a
    # single-person repository). If it does not exist it is auto-created on the first run and proceeds
    # without approval.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          # Release builds do not use the cache (npm docs recommendation) — reproducibility.
          # Since setup-node v7, `NODE_AUTH_TOKEN` is no longer exported with a dummy value (PR #1558).
          # So the `_authToken=${NODE_AUTH_TOKEN}` in the .npmrc written by registry-url above stays an
          # unresolved string in non-publish steps; confirmed that npm 10.9.9/11.6.2/11.19.1 are all
          # unaffected for reads (`npm ci`/`npm view`) (2026-09-04, reproduced locally). For publish the
          # OIDC-exchanged token overrides it.

      - name: Pin npm version (trusted publishing only works on npm CLI 11.5.1+)
        # The npm 10.x bundled with the runner's Node 22 does not know the OIDC token exchange — without
        # this step publish silently falls back to token auth and fails with `ENEEDAUTH`. Pinned
        # version instead of `@latest` (SR2-CI-002 principle).
        run: |
          npm install -g npm@11.19.1
          npm -v

      - name: Verify that the tag matches the package.json version
        # `v0.1.0` tag ↔ `"version": "0.1.0"`. If they differ, do not publish — this catches pushing a
        # tag without bumping the version, or the reverse (npm rejects republishing the same version,
        # but we stop it before that).
        run: |
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version} — not publishing."
            exit 1
          fi
          echo "Publish target: $(node -p 'require("./package.json").name')@${pkg_version} (tag ${GITHUB_REF_NAME})"

      - run: npm ci

      - name: npm publish --provenance (prepublishOnly runs check + verify:pack first)
        # Authentication is trusted publishing (OIDC) only — there is no token in env. See the
        # "Authentication" header comment above.
        run: npm publish --provenance --access public

      - name: Verify publish (read back from the registry)
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          # Retry while waiting for registry propagation. On the first publish (v0.1.0, 2026-09-04)
          # publish succeeded at 12:20:56 but this check only got 404s within 10s×6=60s and ended in a
          # false failure (it resolved fine 1~2 minutes later). So the window is widened to 3 minutes
          # (10s×18) — this step cannot undo the publish itself (npm rejects republishing the same
          # version), so the message states plainly that a failure may mean "not readable yet" rather
          # than "not published".
          for i in $(seq 1 18); do
            if npm view "${name}@${version}" version --json >/dev/null 2>&1; then
              echo "Registry confirmed: ${name}@${version}"
              npm view "${name}@${version}" dist.tarball dist.integrity --json
              exit 0
            fi
            sleep 10
          done
          echo "::error::Could not read ${name}@${version} from the registry within 3 minutes after publishing — if the publish step above printed '+ ${name}@${version}', the publish succeeded and only propagation is delayed. Check directly on npmjs.com."
          exit 1
