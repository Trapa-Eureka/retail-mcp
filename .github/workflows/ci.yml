name: CI

# TASKS T35 (QA-002~006, OPS-006) — the first CI workflow of this repository. It runs the release
# gate recommended by docs/008 (TESTING.md §8) on every push/PR. The actual npm publish workflow is
# `release.yml` (T37, `v*` tag push) — only commits that passed this workflow as a required check and
# were merged into main are eligible for publishing (SR2-CI-004 ruleset), and right before publishing
# `prepublishOnly` runs check + verify:pack again.

on:
  push:
    branches: [main]
  pull_request:

# Second adversarial review SR2-CI-001 — without an explicit declaration the effective GITHUB_TOKEN
# permissions depend on the repository/organization default settings (if that default is widened
# later, fork PR code inherits those permissions as-is). All four jobs only check out and run local
# commands (npm ci/test/lint etc.) and write nothing — the SBOM `actions/upload-artifact` also
# authenticates with the Actions runtime token, not GITHUB_TOKEN, so it needs no extra permission.
# The whole workflow is pinned to the minimum (`contents: read`) — if a job that needs write access
# (e.g. posting PR comments) is added later, grant the permission to that job individually (do not
# widen the global scope).
permissions:
  contents: read

# Second adversarial review SR2-CI-002 — every external Action is pinned to a **full commit SHA**
# with the human-readable tag left as a trailing comment (a movable tag such as `@v4` means CI for the
# same commit runs different code once upstream moves it, and in a supply-chain compromise the code
# that touches the checked-out source and tokens changes). Each SHA was verified with
# `gh api repos/<owner>/<action>/git/ref/tags/<tag> --jq .object.sha` and equals the `v4` tag at pin
# time, so there is no behaviour change. Updates are proposed by `.github/dependabot.yml`
# (github-actions ecosystem, monthly) as PRs that bump the SHA and tag comment together, and a human
# merges them — no auto-merge. When adding a new Action, write the SHA, not the tag (TESTING.md §8
# "supply-chain gate").

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Packaging gate (TASKS T29) + OPS-006 OS/Node matrix — actually verifies the support range that
  # README/DESIGN §12.8 already document (Node 20+, macOS verified, Linux unverified, **Windows
  # explicitly unverified** — the `ps`-based OPS-002 auxiliary signal in fileLock.ts does not exist on
  # Windows and only falls back, so it is not in the matrix). Runs Node 20 (the minimum supported
  # version declared by engines.node, still receiving security patches as of 2026-09-03, EOL 2027-04)
  # together with 22 (the next maintenance LTS). CI running on a Linux runner (ubuntu-latest) by
  # itself resolves "Linux unverified".
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    # SR2-CI-003 (second adversarial review) — upper bound for the whole job. Vitest's
    # testTimeout/hookTimeout only bound individual tests and do not bound `npm ci`, the tarball
    # install in verify:pack, or an npm audit network hang, so this keeps a deadlocked PR (malicious
    # or accidental) from occupying a runner for 6 hours (GitHub default). Value = roughly 2x the
    # observed maximum: PR #63~#68 (2026-09-04) max 24m28s (macOS, node 20). macOS runner variance is
    # large (the same job takes 5m~24m) and the test count keeps growing, so leave generous headroom.
    # Re-tuning criteria: TESTING.md §8 "supply-chain gate".
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - name: verify:pack (OPS-006 — clean tarball install smoke)
        # `--audit-unavailable=warn` (2026-09-04, decision delegated by the user): step 6's tarball
        # `npm audit` passes with a warning **only when it could not obtain a valid report** —
        # unapproved vulnerabilities and expired exceptions still fail. Added because an npm advisory
        # endpoint outage the same day made PR #72~#74 unmergeable one after another (SR2-AUD-001 fix
        # criterion "separate the PR gate from the release gate"). The actual publish path
        # (`prepublishOnly` → `npm run verify:pack`, no flag = fail) stays fail-closed, so nothing is
        # published without a valid audit. Rationale and safety argument: module comment in
        # src/core/tarballAuditPolicy.ts.
        run: npm run verify:pack -- --audit-unavailable=warn

  # QA-002/003 — promote the coverage threshold to a required gate (core 90/90/90/85 + separate
  # per-risk-module thresholds, see vitest.config.ts). Not included in local `npm run check` (too
  # heavy, TESTING.md §8).
  coverage:
    name: coverage thresholds (QA-002/QA-003)
    runs-on: ubuntu-latest
    # SR2-CI-003 — roughly 2x the observed maximum of 10m17s (PR #68, 2026-09-04).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage

  # QA-004 — component tests against a real Postgres service container (migration/rollback/READ
  # ONLY/advisory lock/explore_sql timeout). Only tests/component/** is targeted and it is fully
  # separated from the default gate (guardrail 2) (see the exclude in vitest.config.ts and
  # vitest.component.config.ts).
  postgres-component:
    name: postgres component tests (QA-004)
    runs-on: ubuntu-latest
    # SR2-CI-003 — roughly 3x the observed maximum of 4m24s (PR #65, 2026-09-04) (includes the
    # service container pull and health-check wait, so variance is large).
    timeout-minutes: 15
    services:
      postgres:
        # SR2-CI-002 — pinned to the manifest digest instead of the movable `postgres:16` tag
        # (Docker Hub `library/postgres` tag `16`, verified 2026-09-04, last_updated 2026-08-26).
        # Dependabot does not update workflow `services.image`, so this digest alone is updated by a
        # human — procedure: TESTING.md §8 "supply-chain gate".
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: retail_mcp
          POSTGRES_PASSWORD: retail_mcp
          POSTGRES_DB: retail_mcp_component_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:pg-component
        env:
          # A CI-only container DB created fresh on every run — never point this at a production or
          # shared DB (see the header comment of tests/component/postgres.component.test.ts).
          TEST_DATABASE_URL: postgres://retail_mcp:retail_mcp@localhost:5432/retail_mcp_component_test

  # QA-006 — dependency audit (lockfile-based; fail-open/closed policy in src/adapters/
  # auditLockfile.ts) + committed-secret scan + SBOM generation. The tarball-based audit (SEC-006
  # approved-exception check) is already performed by the test job's verify:pack on every OS/Node
  # combination.
  audit:
    name: dependency audit + secret scan (QA-006)
    runs-on: ubuntu-latest
    # SR2-CI-003 — 2x the observed maximum of 15m0s (PR #66, 2026-09-04 — including npm audit
    # registry retries). The audit retry (src/adapters/npmAudit.ts) is at most 3 attempts with
    # exponential backoff, so it finishes within minutes on its own; exceeding 30 minutes is a real
    # hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SR2-SEC-003 (second adversarial review) — the history-range mode (`--range`) of
          # secret-scan has to open the tree of every commit between base..head, so the full history
          # is required. The old comment said "scans all tracked files", but that only meant the
          # current tree (git ls-files) and overstated the actual scan scope — secrets added and
          # removed in an intermediate commit were never looked at.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:lockfile
      - name: secret-scan (current tree + PR/push history range, SR2-SEC-003)
        # pull_request: base branch tip..PR head (the actual head, not the merge commit — the merge
        # commit's blobs are a subset anyway). push: previous tip..new tip. If base is all-zero (first
        # push/force push) the script explicitly reports the range scan as "skipped" and decides on
        # the tree scan alone.
        env:
          SCAN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npm run secret-scan -- --range="$SCAN_BASE..$SCAN_HEAD"
      - name: Generate SBOM (CycloneDX)
        # Calls `npm sbom` directly rather than `npm run sbom` (the package.json script, for local
        # convenience) — `npm run` also prints its banner lines ("> pkg@ver sbom\n> npm sbom ...") to
        # stdout, which corrupts the redirected JSON file (confirmed empirically, TASKS T35).
        run: npm sbom --omit=dev --sbom-format cyclonedx > sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
