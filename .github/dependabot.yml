# Second adversarial review SR2-CI-002 — the Actions in `.github/workflows/ci.yml` are pinned to
# full commit SHAs (movable `@v4` tags are forbidden). Without an update mechanism, SHA pinning merely
# trades "the risk of a tag being moved" for "the risk of running permanently stale code", so
# Dependabot opens a PR once a month, when a new release exists, that updates the SHA and the
# `# vX.Y.Z` comment together. That PR has to pass the entire CI gate like any other PR and **a human
# merges it** (no auto-merge configured). Dependabot has no access to secrets, and this repository's
# workflows run with `permissions: contents: read`, so nothing is written from the PR.
#
# The scope is intentionally github-actions only — automatic npm dependency updates are a separate
# decision (the lockfile audit is already enforced fail-closed on every PR by CI's `audit` job,
# docs/005 SEC-006). Dependabot does not update workflow `services.image` (the postgres digest), so
# follow the manual procedure in TESTING.md §8.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Bundle into a single PR per month — reviewing once is less burden than the three Actions
      # (checkout/setup-node/upload-artifact) each opening a PR and running the CI matrix three times.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
